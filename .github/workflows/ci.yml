name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.9.27
      - run: uv sync --locked --python '${{ matrix.python-version }}'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/agent_eval_lab
      - run: uv run pytest --cov=agent_eval_lab --cov-report=term-missing
      - run: uv run agent-eval validate
      - run: uv run agent-eval demo --variant control --output runs/control.json
      - run: uv build
